<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 2px solid;
            width: 35px;
            text-overflow: clip;/*ellipse is used so that if width is less but 
            words are more then it will be follow up to the next line
            there is an another exsmple of clip it will not consider 
            extra word width*/
            overflow: hidden;/*overflow is used if the words are going
            out of width then it can be managed*/
        }
    </style>
</head>

        moin mera naam hai tumhaara naam kya hai
    </div>
