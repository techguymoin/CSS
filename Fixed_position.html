<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*It's position will be static normally first will be first div and second will be second div and continues*/
        *{
            margin: 0;
            padding: 0;
        }
        .box{
    border: 2px solid;
    height: 200px;
    width: 80vw;
    padding: 3px;
    margin: 3px;
}
        .box1{
        background-color:aqua ;
        }
        
        .box2{
         background-color: bisque;   
        }
        
        .box3{
        background-color: cadetblue;    
        }
        /*this box will stay at its place while the other page is can be scrolled*/
        .box4{
            height: 80px;
          background-color:darkolivegreen ; 
          position: fixed; 
          bottom: 0px;
          right: 0px;
        }

    </style>
</head>
<body>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>


</body>
</html>
