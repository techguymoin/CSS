<head>

    <title>Document</title>
    <style>
        body {

        img {
            border-radius: 20px;

        .card {

        }

        .img {
            height: 150px;
            box-sizing: border-box;

            border: 2px solid;
            border-radius: 20px;


        }

        .heads {
            display: inline-block;
            margin-top: -10px;
            border: 2px solid;
            border-radius: 15px;
            padding: 4px;
            padding-bottom: 0;
            padding-top: 0;
        }

        .one {
            margin-left: 10px;
           
        }

        .two {
            margin-left: 10px;
            border-radius: 10px;
        }
        .content2{
            margin: auto;
            height: 100px;
            text-align: center;
            overflow:auto;
        }
    </style>
</head>

<body>


    <div class="card">
        <div class="img">

                alt="" height="100%" width="100%">
        </div>
        <div class="content">
            <p class="heads one">
                nature
            </p>
            <p class="heads two">
                lake
            </p>
        </div>
        <div class="content2">
            Lorem ipsum, dolor sit amet consectetur adipisicing elit. Debitis ut tempore officia porro quo amet voluptatibus beatae mollitia eum fugiat.

</html>
