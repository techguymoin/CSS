<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .box {
            height: 121px;
            width: 121px;
            background-color: rgb(0, 98, 255);
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;   
            animation: front 3s linear infinite, bounce 1s ease-out infinite alternate;
        }

        .container {
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: rgb(228, 228, 255);
        }

            @keyframes front {
                from{
                 left: 0;
                }
                to{
                   left: 100%;
                }
               
            }
         @keyframes bounce {
                   from{
                    bottom: 0;
                    bottom: 100%;
                   }
                }
    </style>
</head>
<body>
<div class="container">
    <div class="box">

    </div>
</div>
</body>
</html>
