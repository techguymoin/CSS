<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            height: 500px;
            background-color: antiquewhite;
            border: 2px solid;
            gap: 30px;
        }

        .box {
            height: 100px;
            width: 100px;
            border: 2px solid;
            background-color: aliceblue;
            transform: translate(40%)
        }

        .box1 {
            margin-top: 5px;
            height: 100px;
            width: 100px;
            border: 2px solid;
            background-color: aliceblue;
            transform: translateX(20%);
        }

        .box2 {
            height: 100px;
            width: 100px;
            border: 2px solid;
            background-color: aliceblue;
            transform: translateY(30%);
        }

        .box3 {
            height: 100px;
            width: 100px;
            border: 2px solid;
            background-color: aliceblue;
            transform: translateX(30%) skew(45deg) translateY(100px);/*using multiple properties*/
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">

        </div>
        <div class="box1">

        </div>
        <div class="box2">

        </div>
        <div class="box3">

        </div>
    </div>
</body>

</html>
