<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 500px;
            background-color: antiquewhite;
            border: 2px solid;
            display: flex;     
            gap: 30px;
           }
        .box{
            height: 100px;
            width: 100px;
            border: 2px solid;
            background-color: aliceblue;
            transform: scale(1.2);
        }
        .box1{
            
            height: 100px;
            width: 100px;
            border: 2px solid;
            background-color: aliceblue;
            transform: scaleX(1.2);
        }
        .box2{
            height: 100px;
            width: 100px;
            border: 2px solid;
            background-color: aliceblue;
            transform: scaleY(1.2);
        }

    </style>
</head>
<body>
    <div class="container">
     <div class="box">

     </div>
     <div class="box1">

     </div>
     <div class="box2">

     </div>
    </div>
</body>
</html>
