<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: rgb(224, 224, 252);
            height: 800px;
            position:relative ;
            display: flex;
            align-items: center;
        }
        .box {
    background-color: rgb(46, 46, 134);
    height: 100px;
    width: 100px;
    position: absolute;

    animation: animateX 2s linear forwards,
               large 2s ease-in-out forwards;
}

@keyframes animateX {
    from {
        left: 0;
    }

    to {
        left: calc(100% - 100px);
    }
}

@keyframes large {
    0%, 100% {
        height: 100px;
        width: 100px;
    }

    50% {
        height: 200px;
        width: 200px;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
    </div>
</body>
</html>
