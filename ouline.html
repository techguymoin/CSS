<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

/*outline: width style color;
width: Sets the outline width.
style: Determines the style of the outline such as solid, dotted, or dashed.
color: Sets the outline color.
outline will be draw outside the border*/

.outline{
    border: 4px solid green;
    outline: 2px solid blue;
}
.outline-offset{
    margin-top: 200px;
        outline: 2px solid blue;
        outline-offset: 10px;
}
    </style>
</head>
<body>
    <p class="outline">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Officia, impedit!</p>
        <p class="outline-offset">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Officia, impedit!</p>

</body>
</html>
