<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(210, 234, 255);
        }

        .card {
            background-color: white;
            box-sizing: border-box;
            border: 2px solid;
            height: 70vh;
            width: 20vw;
            margin: auto;
            margin-top: 140px;
            border-radius: 10px;
        }
        .img{
            box-sizing: border-box;
            height: 30vh;
            width: 19vw;
            border: 2px solid;
            margin: 8px auto;
            border-radius: 10px;
        }
        div span {
            border: 2px rgba(95, 94, 94, 0.711) solid ;
            margin: 4px;
           
            border-radius: 14px;
            padding: 2px;
            padding-left: 4px;
            padding-right: 4px;
        }
        .qualities{
            margin-left: 10px;
            margin-top: 18px;
        }
        .content{
            margin-left: 18px;
            margin-top: -5px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
        }
        div h3{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 22px;
            margin-top: -15px;
        }
        
        .button span{
            border-radius: 20px;
            border: none;
            background-color: rgb(180, 229, 248);
            margin: auto;
            color: rgb(0, 166, 255);
            margin-left: 100px;
            padding: 5px;
            position: relative;
            top: -16px;
        }
        
    </style>
</head>

<body>
    <div class="card">
    <div class="img">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRljMXXCoV1vjfOhzurLPcst8vQEXMkvpI7HkI7mOMvUg&s=10" alt="" height="100%" width="100%">
    </div>    
    <div class="qualities">
        <span>Nature</span>
        <span>Lake</span>
    </div>
    <div class="content">
        <h1>What is Nature?</h1>
        <h3>Nature is the beauty of the world around us. It includes forests, mountains, rivers, lakes, animals, and plants.</h3>
    </div>
    <div class="button">
        <span>Read more</span>

    </div>
</div>
</div>
</body>

</html>
