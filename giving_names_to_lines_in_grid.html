
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>

    <style>
        .container {
            border: 2px solid black;
            display: grid;
            grid-template-columns: [fc] 200px [sc] 200px;
            grid-template-rows: [fr] 100px [sr] 100px [tr] 100px;
        }

        .items {
            border: 2px solid black;
            height: 50px;
            width: 50px;
        }

        .item-1 {
            grid-row: fr/sr;
            grid-column: fc/sc;
        }

        .item-4 {
            grid-row: fr/sr;
            grid-column: fc/sc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items item-1">1</div>
        <div class="items">2</div>
        <div class="items">3</div>
        <div class="items item-4">4</div>
        <div class="items">5</div>
    </div>
</body>
</html>
