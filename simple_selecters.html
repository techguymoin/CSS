<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecters</title>
    <style>
       /* elemenet selector*/
     p{
        background-color: red;
     }
    /*class selector*/
     .box{
        background-color: antiquewhite;
     }
     /*id selector*/
     #boxB{
        background-color: aqua;
     }
    </style>
</head>
<body>
    <p>
        I am a paragraph
    </p>
    <div class="box" id="boxA">I am a div</div>
    <div class="box1" id="boxB">I am another div</div>
</body>
</html>
