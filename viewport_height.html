<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* vh stands for Viewport Height. */
/* It is used to set sizes relative to the height of the screen. */
/* 1vh = 1% of the viewport height. */
        *{
            margin: 0;
            padding: 0;
        }
    .box{
        width: 80vh;
        margin: auto;
        background-color: aquamarine;
        border: 2px solid;
        height: 50vh;
        box-sizing: border-box;
    }
    .container{
        width: 80vh;
        margin: auto;
        background-color: aquamarine;
        border: 2px solid;
        height: 50vh;
        box-sizing: border-box;
    }
    </style>
</head>
<body>
   <div class="box">
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Quos, recusandae!
   </div>
   <div class="container">
    Lorem ipsum dolor sit, amet consectetur adipisicing elit. Harum aliquam ea natus illo voluptate commodi illum, eum impedit quas nulla.
   </div> 
</body>
</html>
