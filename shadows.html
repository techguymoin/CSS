<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*box-shadow: h-offset v-offset blur spread color inset;
h-offset and v-offset: Determines the shadow's horizontal and vertical position.
blur: The larger the value, the blurrier the shadow.
spread: Expands or shrinks the shadow size.
color: Defines the shadow color.
inset: Makes the shadow inner.
Example: Basic Shadow
*/
.card {
  width: 200px;
  min-height: 100px;
  background: white;
  box-shadow: 5px 5px 10px 5px #888888 ;
}
/*text-shadow: h-offset v-offset blur color;*/
.text-shadow{
    text-shadow: 5px 5px 5px #888888;
}
    </style>
</head>
<body>
    <div class="card">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Esse beatae ab delectus non quis tempora aliquam molestiae. Cumque, illum architecto.
    </div>
    <p class="text-shadow">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Assumenda, iste.</p>
</body>
</html>
