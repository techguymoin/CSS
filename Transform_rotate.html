<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            background-color: antiquewhite;
            height: 500px;
            border: 2px solid;
            display: flex;
            gap: 20px;
        }

        .box {
            background-color: azure;
            height: 100px;
            width: 100px;
            border: 2px solid;
            transform: rotate(20deg);
            /*Or we cam write like this transform: rotate(0.25turn);*/
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box1 {

            background-color: azure;
            height: 100px;
            width: 100px;
            border: 2px solid;
            transform: rotateX(80deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box2{
            background-color: azure;
            height: 100px;
            width: 100px;
            border: 2px solid;
            transform: rotateZ(20deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">Moin
        </div>
        <div class="box1">Moin
        </div>
        <div class="box2">
            Moin
        </div>
    </div>
</body>

</html>
