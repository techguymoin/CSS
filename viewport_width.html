<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* vw stands for Viewport Width. */
/* It is used to set sizes relative to the width of the screen. */
/* 1vw = 1% of the viewport width. */
        *{
            margin: 0px;
            padding: 0px;
        }
        .box{
            box-sizing: border-box;
            background-color: aqua;
            width: 80vw;
            margin: auto;
            text-overflow: clip;
        }
        .lorem{
            box-sizing: border-box;
            background-color: aqua;
            width: 80vw;
            margin: 23px auto;
            text-overflow: clip;
        }
    </style>
</head>
<body>
<div class="box">MOIN </div></body>
<div class="lorem">Lorem ipsum dolor sit amet consectetur adipisicing elit. Cupiditate quo enim quos tenetur a voluptate corporis quisquam, accusantium dolore maiores.</div>
</html>
