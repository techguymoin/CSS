<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        /*we use display:inline to make a block element inline but it'll not
        able to have padding,margin,width properties correctly*/
    .box{
        border: 2px solid;
        display: inline-block;
        padding: 20px;
        margin: 20px;
    }
    .box1{
        visibility: hidden;/*it will hidden the div and its content but it's space will be there*/
    }
    .box2{
        display: none;/*it will totally remove div and it's content*/
    }
    </style>
</head>
<body>
    <div class="box">
       i am good
    </div>
    <div class="box">also nice</div>
    <div class="box box1">i am good</div>
    <div class="box box2">i am good</div>
     <span>
        i am good
     </span>
     <span>
        i am good
     </span>
</body>
</html>
